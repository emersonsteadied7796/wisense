[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisense"
version = "0.1.3"
description = "WiFi CSI human sensing (presence, falls, breathing, activity, occupancy) for Python -- no camera, no cloud."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]
requires-python = ">=3.9"
keywords = ["wifi", "csi", "sensing", "presence-detection", "fall-detection", "iot", "esp32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Home Automation",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "onnxruntime>=1.15",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
viz = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/wisense"
Documentation = "https://github.com/YOUR-GITHUB-USERNAME/wisense/blob/main/docs/usage.md"
Issues = "https://github.com/YOUR-GITHUB-USERNAME/wisense/issues"
Changelog = "https://github.com/YOUR-GITHUB-USERNAME/wisense/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["wisense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
